
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuibitX Business Chatbot</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef2ff;
            color: #172033;
        }

        .container {
            max-width: 650px;
            margin: 30px auto;
            padding: 20px;
        }

        .chat-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 30px #17203318;
        }

        /* Header */
        .header {
            background: #4338ca;
            color: white;
            padding: 22px;
        }

        .header h1 {
            margin: 0 0 8px;
            font-size: 23px;
        }

        .header p {
            margin: 0;
            font-size: 14px;
        }

        /* Suggested Questions */
        .suggestions {
            padding: 18px;
            background: #ffffff;
            border-bottom: 1px solid #e5e7eb;
        }

        .suggestions h3 {
            font-size: 16px;
            margin: 0 0 13px;
            color: #4338ca;
        }

        .question-list {
            display: flex;
            flex-wrap: wrap;
            gap: 9px;
        }

        .question-btn {
            background: #eef2ff;
            color: #4338ca;
            border: 1px solid #c7d2fe;
            border-radius: 20px;
            padding: 9px 13px;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
        }

        .question-btn:hover {
            background: #4338ca;
            color: white;
        }

        .question-btn:disabled {
            opacity: 0.5;
            cursor: wait;
        }

        /* Chat Messages */
        #messages {
            height: 350px;
            overflow-y: auto;
            padding: 20px;
        }

        .message {
            padding: 12px 15px;
            margin-bottom: 12px;
            border-radius: 12px;
            max-width: 85%;
            line-height: 1.5;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .bot {
            background: #f1f5f9;
            margin-right: auto;
        }

        .user {
            background: #4338ca;
            color: white;
            margin-left: auto;
        }

        /* Input Form */
        .chat-form {
            display: flex;
            gap: 10px;
            padding: 15px;
            border-top: 1px solid #e5e7eb;
        }

        #messageInput {
            flex: 1;
            min-width: 0;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 15px;
        }

        #sendButton {
            border: 0;
            border-radius: 10px;
            padding: 13px 20px;
            background: #4338ca;
            color: white;
            cursor: pointer;
        }

        #sendButton:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        /* Footer */
        .footer {
            text-align: center;
            color: #64748b;
            font-size: 13px;
            padding: 15px;
        }

        .footer a {
            color: #4338ca;
            text-decoration: none;
        }

        /* Mobile Responsive */
        @media (max-width: 640px) {
            .container {
                margin: 10px auto;
                padding: 10px;
            }

            .header h1 {
                font-size: 20px;
            }

            #messages {
                height: 350px;
            }

            .question-btn {
                font-size: 12px;
                padding: 8px 10px;
            }

            #sendButton {
                padding: 12px 15px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <section class="chat-card">

            <!-- Chatbot Header -->
            <header class="header">
                <h1>{{ business.name }} AI Assistant</h1>
                <p>Ask us about our software services.</p>
            </header>

            <!-- Suggested Questions -->
            <div class="suggestions">

                <h3>Frequently Asked Questions</h3>

                <div class="question-list">

                    <button type="button" class="question-btn"
                        data-question="Hello">
                        👋 Hello
                    </button>

                    <button type="button" class="question-btn"
                        data-question="What services do you offer?">
                        Our Services
                    </button>

                    <button type="button" class="question-btn"
                        data-question="What are your prices?">
                        Pricing
                    </button>

                    <button type="button" class="question-btn"
                        data-question="Where are you located?">
                        Location
                    </button>

                    <button type="button" class="question-btn"
                        data-question="What are your working hours?">
                        Working Hours
                    </button>

                    <button type="button" class="question-btn"
                        data-question="How can I contact you?">
                        Contact Us
                    </button>

                    <button type="button" class="question-btn"
                        data-question="Do you develop AI chatbots?">
                        AI Chatbots
                    </button>

                    <button type="button" class="question-btn"
                        data-question="Do you develop websites?">
                        Web Development
                    </button>

                    <button type="button" class="question-btn"
                        data-question="Can you automate my business?">
                        Business Automation
                    </button>

                </div>
            </div>

            <!-- Chat Messages -->
            <div id="messages" aria-live="polite">

                <div class="message bot">
                    Hello! Welcome to QuibitX.

                    Select a question above or type your own question.
                    We are happy to help you!
                </div>

            </div>

            <!-- Chat Input -->
            <form id="chatForm" class="chat-form">

                <input
                    id="messageInput"
                    type="text"
                    placeholder="Type your message..."
                    maxlength="1000"
                    autocomplete="off"
                    required
                    aria-label="Your message"
                >

                <button id="sendButton" type="submit">
                    Send
                </button>

            </form>

        </section>

        <!-- Footer -->
        <div class="footer">

            Powered by QuibitX |

            <a href="{{ business.website }}"
               target="_blank"
               rel="noopener noreferrer">

                Visit our website

            </a>

        </div>

    </main>

    <script>

        const form = document.getElementById("chatForm");
        const input = document.getElementById("messageInput");
        const messages = document.getElementById("messages");
        const button = document.getElementById("sendButton");

        const questionButtons =
            document.querySelectorAll(".question-btn");


        // Display chat messages
        function addMessage(text, sender) {

            const message = document.createElement("div");

            message.className = `message ${sender}`;

            message.textContent = text;

            messages.appendChild(message);

            messages.scrollTop = messages.scrollHeight;

            return message;
        }


        // Send message to Flask backend
        async function sendMessage(message) {

            if (!message || button.disabled) {
                return;
            }

            addMessage(message, "user");

            input.value = "";

            button.disabled = true;

            questionButtons.forEach(btn => {
                btn.disabled = true;
            });

            const typing = addMessage("Typing...", "bot");

            try {

                const response = await fetch("/chat", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        message: message
                    })

                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.error || "Request failed."
                    );
                }

                typing.textContent = data.reply;

            } catch (error) {

                typing.textContent =
                    "Sorry, something went wrong. Please try again.";

                console.error(error);

            } finally {

                button.disabled = false;

                questionButtons.forEach(btn => {
                    btn.disabled = false;
                });

                input.focus();

                messages.scrollTop = messages.scrollHeight;
            }
        }


        // Handle typed customer messages
        form.addEventListener("submit", async (event) => {

            event.preventDefault();

            const message = input.value.trim();

            await sendMessage(message);

        });


        // Handle suggested question clicks
        questionButtons.forEach(btn => {

            btn.addEventListener("click", async () => {

                const question = btn.dataset.question;

                await sendMessage(question);

            });

        });

    </script>

</body>
</html>
